name: Build & Deploy Server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chexy-server
  CONTAINER_NAME: chexy-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Deploy to DigitalOcean droplet
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          SERVER_PUBLIC_IP: ${{ secrets.SERVER_PUBLIC_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no "${DO_USER}@${DO_HOST}" <<EOF
            set -e
            docker login ghcr.io -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
            docker pull "${IMAGE_NAME}:latest"
            docker stop "${CONTAINER_NAME}" || true
            docker rm "${CONTAINER_NAME}" || true
            docker run -d --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -e CHEXY_SERVER_BIND_IP=0.0.0.0 \
              -e CHEXY_SERVER_PUBLIC_IP="${SERVER_PUBLIC_IP}" \
              -e CHEXY_SERVER_HTTP_PORT=8080 \
              -e CHEXY_SERVER_NATIVE_PORT=8081 \
              -e CHEXY_SERVER_WT_PORT=8082 \
              -e CHEXY_SERVER_WS_PORT=8083 \
              -p 8080:8080 \
              -p 8081:8081/udp \
              -p 8082:8082 \
              -p 8083:8083 \
              "${IMAGE_NAME}:latest"
          EOF
